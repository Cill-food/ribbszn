<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KDS - RibbsZn</title>
    <style>
      :root {
        --amarelo: #ffd500;
        --preto-card: #2c2c2c;
        --fundo: #1a1a1a;
        --texto: #f0f0f0;
        --verde: #28a745;
        --vermelho: #dc3545;
        --azul: #007bff;
        --cinza-claro: #bbb;
        --shadow-soft: 0 4px 12px rgba(0, 0, 0, 0.3);
        --shadow-hover: 0 8px 20px rgba(0, 0, 0, 0.4);
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 20px;
        background-color: var(--fundo);
        color: var(--texto);
        overflow-x: hidden;
      }

      body.light-mode {
        --fundo: #f0f0f0;
        --texto: #333;
        --preto-card: #fff;
        --shadow-soft: 0 4px 12px rgba(0, 0, 0, 0.1);
        --shadow-hover: 0 8px 20px rgba(0, 0, 0, 0.15);
      }

      h1 {
        color: var(--amarelo);
        border-bottom: 2px solid var(--amarelo);
        padding-bottom: 10px;
        margin-bottom: 20px;
        font-size: 2em;
        text-align: center;
      }

      #ordersContainer {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 24px;
        padding-bottom: 80px;
      }

      .order-card {
        background-color: var(--preto-card);
        padding: 20px;
        border-radius: 12px;
        border-left: 8px solid var(--amarelo);
        box-shadow: var(--shadow-soft);
        display: flex;
        flex-direction: column;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }

      .order-card:hover {
        transform: translateY(-5px);
        box-shadow: var(--shadow-hover);
      }

      .order-card.preparo {
        border-left-color: var(--azul);
      }

      .order-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        border-bottom: 1px solid #444;
        padding-bottom: 12px;
        margin-bottom: 12px;
      }

      .order-header strong {
        font-size: 1.4em;
        display: block;
      }

      /* --- NOVA ESTILIZAÇÃO PROFISSIONAL ATUALIZADA --- */
      .mgmt-container {
        padding: 10px;
      }

      .section-title {
        color: var(--amarelo);
        margin: 20px 0 10px 0;
        border-left: 4px solid var(--amarelo);
        padding-left: 10px;
        text-transform: uppercase;
        font-size: 0.9rem;
      }

      .ingredient-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 12px;
      }

      .ingredient-card {
        background: #2c2c2c;
        border-radius: 8px;
        padding: 12px;
        text-align: center;
        border: 1px solid #444;
        display: flex;
        flex-direction: column;
        transition: 0.2s;
      }

      .ingredient-card.off {
        border-color: var(--vermelho);
        background: #3d1a1a;
      }
      .ingredient-card.on {
        border-color: #444;
      }

      .ingredient-type {
        font-size: 0.65rem;
        color: #888;
        text-transform: uppercase;
      }

      .ingredient-name {
        font-size: 0.95rem;
        font-weight: bold;
        margin: 8px 0;
        color: #fff;
        min-height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .status-badge {
        font-size: 0.6rem;
        font-weight: 900;
        margin-bottom: 5px;
        text-transform: uppercase;
      }
      .status-badge.on {
        color: var(--verde);
      }
      .status-badge.off {
        color: var(--vermelho);
      }

      .toggle-btn {
        border: none;
        border-radius: 4px;
        padding: 8px;
        font-weight: 900;
        cursor: pointer;
        font-size: 0.75rem;
      }
      .btn-on {
        background: var(--verde);
        color: #fff;
      }
      .btn-off {
        background: #555;
        color: #ccc;
      }
      /* --- FIM DA NOVA ESTILIZAÇÃO --- */

      .consumo-badge {
        display: inline-block;
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 0.9em;
        font-weight: bold;
        margin-left: 12px;
        text-transform: uppercase;
      }
      .badge-local {
        background-color: #28a745;
        color: white;
      }
      .badge-viagem {
        background-color: #dc3545;
        color: white;
      }

      .order-time,
      .order-timer {
        font-size: 0.95em;
        color: var(--cinza-claro);
      }

      .order-items {
        flex-grow: 1;
        font-size: 1.15em;
      }
      .order-item {
        margin-bottom: 14px;
        padding: 8px;
        background: #383838;
        border-radius: 6px;
      }

      .item-details {
        font-size: 0.9em;
        color: var(--amarelo);
        margin-top: 4px;
        line-height: 1.3;
      }

      .order-obs {
        background-color: #442;
        padding: 10px;
        border-radius: 8px;
        margin-top: 12px;
        font-size: 0.95em;
        border-left: 4px solid var(--amarelo);
      }

      .order-payment {
        background-color: #333;
        padding: 10px;
        border-radius: 8px;
        margin-top: 12px;
        font-size: 0.95em;
      }

      .order-footer {
        display: flex;
        gap: 12px;
        margin-top: 16px;
      }
      .order-footer button {
        flex: 1;
        padding: 12px;
        border: none;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
        font-size: 1em;
        transition: transform 0.2s ease, background-color 0.2s ease;
      }

      .order-footer button:hover {
        transform: scale(1.02);
      }
      .accept-btn {
        background-color: var(--verde);
        color: white;
      }
      .obs-btn {
        background-color: #555;
        color: white;
      }
      .print-btn {
        background-color: var(--amarelo);
        color: #000;
        width: 60px;
        flex: none !important;
      }
      .delete-btn {
        background-color: var(--vermelho);
        color: white;
        width: 60px;
        flex: none !important;
      }

      /* SIDEBARS */
      #historySidebar,
      #settingsSidebar {
        position: fixed;
        top: 0;
        width: 400px;
        height: 100%;
        background-color: #222;
        box-shadow: -5px 0 15px rgba(0, 0, 0, 0.5);
        transition: 0.3s ease;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        padding: 20px;
      }

      #historySidebar {
        right: -450px;
      }
      #historySidebar.active {
        right: 0;
      }
      #settingsSidebar {
        left: -450px;
        background-color: #1a1a1a;
        box-shadow: 5px 0 20px rgba(0, 0, 0, 0.6);
      }
      #settingsSidebar.active {
        left: 0;
      }

      #historyHeader,
      #settingsHeader {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #444;
        margin-bottom: 15px;
        padding-bottom: 10px;
      }

      #historyTotalBox {
        background: #333;
        padding: 15px;
        border-radius: 8px;
        text-align: center;
        margin-bottom: 15px;
      }

      #historyTotalValue {
        font-size: 1.5em;
        color: var(--verde);
        font-weight: bold;
        margin: 5px 0;
      }

      .close-btn {
        background: none;
        border: none;
        font-size: 1.5em;
        color: var(--cinza-claro);
        cursor: pointer;
      }
      .close-btn:hover {
        color: var(--amarelo);
      }

      .settings-content {
        flex-grow: 1;
        overflow-y: auto;
      }
      .settings-group {
        margin-bottom: 30px;
      }
      .settings-group h4 {
        color: var(--amarelo);
        margin-bottom: 15px;
        font-size: 1.2em;
      }

      .action-btn {
        display: block;
        width: 100%;
        padding: 12px;
        background: var(--azul);
        color: white;
        border: none;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
        margin-bottom: 10px;
      }
      .action-btn.outline {
        background: none;
        border: 2px solid var(--amarelo);
        color: var(--amarelo);
      }

      .kds-input {
        width: 100%;
        padding: 10px;
        border-radius: 6px;
        border: 1px solid #444;
        background: #222;
        color: white;
        font-size: 1em;
        box-sizing: border-box;
      }

      .switch-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
      }

      /* Switch Styles */
      .switch {
        position: relative;
        display: inline-block;
        width: 50px;
        height: 24px;
      }
      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #555;
        transition: 0.4s;
      }
      .slider:before {
        position: absolute;
        content: "";
        height: 16px;
        width: 16px;
        left: 4px;
        bottom: 4px;
        background-color: white;
        transition: 0.4s;
      }
      input:checked + .slider {
        background-color: var(--verde);
      }
      input:checked + .slider:before {
        transform: translateX(26px);
      }
      .slider.round {
        border-radius: 34px;
      }
      .slider.round:before {
        border-radius: 50%;
      }

      /* MODAIS */
      .backdrop {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.7);
        z-index: 1100;
        display: none;
      }
      .kds-modal {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: #333;
        padding: 25px;
        border-radius: 12px;
        z-index: 1200;
        width: 90%;
        max-width: 600px;
        display: none;
        box-shadow: var(--shadow-hover);
        max-height: 85vh;
        overflow-y: auto;
      }

      #historyToggleBtn {
        position: fixed;
        bottom: 20px;
        right: 20px;
        padding: 15px 25px;
        background: var(--azul);
        color: white;
        border: none;
        border-radius: 50px;
        font-weight: bold;
        cursor: pointer;
        z-index: 900;
      }
      #settingsToggleBtn {
        position: fixed;
        bottom: 20px;
        left: 20px;
        padding: 15px 25px;
        background: #333;
        color: white;
        border: none;
        border-radius: 50px;
        font-weight: bold;
        cursor: pointer;
        z-index: 900;
      }

      @media (max-width: 600px) {
        #historySidebar,
        #settingsSidebar {
          width: 100%;
          right: -100%;
          left: -100%;
        }
        #ordersContainer {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <h1>Pedidos - RibbsZn</h1>

    <div id="ordersContainer">
      <p id="noOrdersMessage">Nenhum pedido pendente no momento.</p>
    </div>

    <button id="historyToggleBtn" onclick="toggleSidebar('historySidebar')">
      Ver Histórico
    </button>
    <button id="settingsToggleBtn" onclick="toggleSidebar('settingsSidebar')">
      Configurações
    </button>

    <div id="historySidebar">
      <div id="historyHeader">
        <h3>Pedidos Concluídos</h3>
        <input
          id="historySearch"
          class="kds-input"
          style="width: 150px"
          placeholder="Buscar..."
          oninput="kdsManager.renderHistory(this.value)"
        />
        <button onclick="toggleSidebar('historySidebar')">Fechar</button>
      </div>
      <div id="historyTotalBox">
        <h4>Total do Dia</h4>
        <p id="historyTotalValue">R$ 0,00</p>
        <p id="statsLocal">Local: R$ 0,00</p>
        <p id="statsViagem">Viagem: R$ 0,00</p>
      </div>
      <button onclick="kdsManager.exportHistory()" class="action-btn outline">
        Exportar CSV
      </button>
      <div id="historyContent" style="overflow-y: auto; flex-grow: 1"></div>
    </div>

    <div id="settingsSidebar">
      <div id="settingsHeader">
        <h3>Configurações</h3>
        <button class="close-btn" onclick="toggleSidebar('settingsSidebar')">
          ✕
        </button>
      </div>
      <div class="settings-content">
        <div class="settings-group">
          <h4>Interface</h4>
          <button class="action-btn outline" onclick="kdsManager.toggleTheme()">
            🌗 Alternar Tema
          </button>
        </div>
        <div class="settings-group">
          <h4>Controle de Estoque</h4>
          <button
            class="action-btn"
            onclick="kdsManager.openMenuManagementModal()"
          >
            📋 Gestão de Cardápio
          </button>
          <button
            class="action-btn outline"
            onclick="kdsManager.openIngredientManagementModal()"
          >
            🍅 Gestão de Insumos
          </button>
        </div>
      </div>
    </div>

    <div
      id="backdrop"
      class="backdrop"
      onclick="kdsManager.closeAllModals()"
    ></div>

    <div id="popupObservacao" class="kds-modal">
      <h3>Observação do Pedido</h3>
      <p id="obsOrderInfo"></p>
      <textarea
        id="obsTextarea"
        style="
          width: 100%;
          height: 100px;
          background: #1a1a1a;
          color: white;
          border-radius: 8px;
          padding: 10px;
        "
      ></textarea>
      <div class="order-footer">
        <button class="accept-btn" id="saveObsBtn">Salvar</button>
        <button
          class="obs-btn"
          onclick="kdsManager.closeModal('popupObservacao')"
        >
          Cancelar
        </button>
      </div>
    </div>

    <div id="menuManagementModal" class="kds-modal">
      <h3 id="modalTitle">Gestão de Itens</h3>
      <div id="menuManagementContent" class="mgmt-container"></div>
      <div class="order-footer">
        <button
          class="accept-btn"
          onclick="kdsManager.closeModal('menuManagementModal')"
        >
          Fechar
        </button>
      </div>
    </div>

    <script src="kds.js"></script>
    <script>
      // Funções de controle de UI que precisam estar no HTML ou globais
      function toggleSidebar(id) {
        document.getElementById(id).classList.toggle("active");
      }
      // Atalho para fechar tudo no clique do fundo
      if (!kdsManager.closeAllModals) {
        kdsManager.closeAllModals = function () {
          document
            .querySelectorAll(".kds-modal")
            .forEach((m) => (m.style.display = "none"));
          document.getElementById("backdrop").style.display = "none";
        };
      }
    </script>
  </body>
</html>
